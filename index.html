<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>VISHAAL P — Creative Developer & Designer</title>
    <meta name="title" content="Your Name — Creative Developer & Designer" />
    <meta
      name="description"
      content="Premium portfolio showcasing web development, UI/UX design, and digital experiences. Built with React, crafted with care."
    />
    <meta name="author" content="Your Name" />
    <meta name="keywords" content="portfolio, developer, designer, react, web development, UI/UX" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://your-portfolio.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-portfolio.vercel.app/" />
    <meta property="og:title" content="Your Name — Creative Developer & Designer" />
    <meta
      property="og:description"
      content="Premium portfolio showcasing web development, UI/UX design, and digital experiences."
    />
    <meta property="og:image" content="https://your-portfolio.vercel.app/og-image.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://your-portfolio.vercel.app/" />
    <meta property="twitter:title" content="Your Name — Creative Developer & Designer" />
    <meta
      property="twitter:description"
      content="Premium portfolio showcasing web development, UI/UX design, and digital experiences."
    />
    <meta property="twitter:image" content="https://your-portfolio.vercel.app/og-image.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
